name: om_yahya_recitation_center
description: "The Official App for Om Yahya REcitation Center."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.4+1
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.1.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Beiruti
      fonts:
        - asset: assets/fonts/Beiruti-Regular.ttf
          weight: 400
        - asset: assets/fonts/Beiruti-Medium.ttf
          weight: 500
        - asset: assets/fonts/Beiruti-Bold.ttf
          weight: 700

    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReemKufi-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700


icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
    linux:
      enable: true